[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chess-analyzer-mobile"
version = "1.0.0"
description = "Local-first Python Chess Analyzer for Android and iOS with Stockfish MultiPV, Multi-Engine Comparison, and Chess.com-like Move Classification"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "GPL-3.0-or-later"}
dependencies = [
    "chess>=1.10.0",
    "requests>=2.31.0",
    "httpx>=0.23.0",
]

[project.optional-dependencies]
ui = ["kivy>=2.3.0"]
dev = ["pytest>=7.4.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
