name: Build Android APK & iOS App

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Android Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev ccache
          pip install --upgrade pip "cython<3.0" buildozer requests chess

      - name: Stage Stockfish 19 Android ARM64 Engine & Check Readiness
        run: |
          python3 install_stockfish_19.py || true
          python3 build_mobile.py --check

      - name: Build Android Debug APK via Buildozer
        run: |
          yes | buildozer android debug

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: chess-analyzer-android-apk
          path: bin/*.apk
          retention-days: 14

  build-ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install iOS Build Toolchain
        run: |
          pip install --upgrade pip "cython<3.0" kivy-ios chess requests
          bash platform/ios/stockfish_ios_recipe.sh

      - name: Build Python & Kivy for iOS
        run: |
          toolchain build python3 kivy

      - name: Create & Package Xcode Project
        run: |
          toolchain create ChessAnalyzer .
          PROJ_DIR=$(find . -maxdepth 2 -name "*.xcodeproj" -exec dirname {} \; | head -n 1)
          echo "Found Xcode project in: $PROJ_DIR"
          cd "$PROJ_DIR"
          XCODEPROJ=$(ls -d *.xcodeproj | head -n 1)
          SCHEME=$(basename "$XCODEPROJ" .xcodeproj)
          xcodebuild -project "$XCODEPROJ" -scheme "$SCHEME" -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" PROVISIONING_PROFILE=""
          mkdir -p Payload
          cp -r build/Release-iphoneos/*.app Payload/
          zip -rq ChessAnalyzer-unsigned.ipa Payload/
          mv ChessAnalyzer-unsigned.ipa "$GITHUB_WORKSPACE/"

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: chess-analyzer-ios-ipa
          path: ChessAnalyzer-unsigned.ipa
          retention-days: 14
