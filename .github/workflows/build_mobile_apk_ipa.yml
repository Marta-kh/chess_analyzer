name: Build Android APK & iOS App

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Android Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev ccache
          pip install --upgrade pip "cython<3.0" buildozer requests chess

      - name: Stage Stockfish 19 Android ARM64 Engine & Check Readiness
        run: |
          python3 install_stockfish_19.py || true
          python3 build_mobile.py --check

      - name: Pre-accept Android SDK Licenses
        run: |
          mkdir -p /home/runner/.android
          touch /home/runner/.android/repositories.cfg
          mkdir -p /home/runner/.buildozer/android/platform/android-sdk/licenses
          cp -r /usr/local/lib/android/sdk/licenses/* /home/runner/.buildozer/android/platform/android-sdk/licenses/ 2>/dev/null || true
          echo -e "\n893737222479664464147799c4b05b5010f5371f\n24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e" >> /home/runner/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" >> /home/runner/.buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license

      - name: Build Android Debug APK via Buildozer
        run: |
          yes | buildozer -v android debug

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: chess-analyzer-android-apk
          path: bin/*.apk
          retention-days: 14

  build-ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install iOS Build Toolchain
        run: |
          pip install --upgrade pip "cython<3.0" kivy-ios chess requests
          bash platform/ios/stockfish_ios_recipe.sh

      - name: Build Python & Kivy for iOS
        run: |
          toolchain build python3 kivy

      - name: Create & Package Xcode Project
        run: |
          toolchain create chessanalyzer .
          cd chessanalyzer-ios
          xcodebuild -project chessanalyzer.xcodeproj -scheme chessanalyzer -configuration Release -sdk iphoneos IPHONEOS_DEPLOYMENT_TARGET=13.0 CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" PROVISIONING_PROFILE="" -derivedDataPath build clean build
          mkdir -p Payload
          APP_PATH=$(find build -name "*.app" -type d | head -n 1)
          echo "Found compiled app at: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -rq ChessAnalyzer-unsigned.ipa Payload/
          mv ChessAnalyzer-unsigned.ipa "$GITHUB_WORKSPACE/"

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: chess-analyzer-ios-ipa
          path: ChessAnalyzer-unsigned.ipa
          retention-days: 14
