name: Build Android APK & iOS App

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Android Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev ccache
          pip install --upgrade pip "cython<3.0" buildozer requests chess

      - name: Stage Stockfish 19 Android ARM64 Engine & Check Readiness
        run: |
          python3 install_stockfish_19.py || true
          python3 build_mobile.py --check

      - name: Install Android SDK components required by Buildozer
        run: |
          # Use the SDK preinstalled on the GitHub runner rather than creating
          # an empty ~/.buildozer SDK directory (which hides sdkmanager).
          SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "Using Android SDK at $SDK_ROOT"
          test -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          mkdir -p "$SDK_ROOT/tools/bin" "$HOME/.android"
          touch "$HOME/.android/repositories.cfg"
          ln -sf "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "$SDK_ROOT/tools/bin/sdkmanager"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;25.2.9519653"
          echo "ANDROIDSDK=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROIDNDK=$SDK_ROOT/ndk/25.2.9519653" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Build Android Debug APK via Buildozer
        shell: bash
        run: |
          set -o pipefail
          # The Android Gradle Plugin used by current python-for-android requires Java 17.
          export JAVA_HOME="/usr/lib/jvm/temurin-17-jdk-amd64"
          export PATH="$JAVA_HOME/bin:$PATH"
          java -version
          javac -version
          # Keep the full build log so the real Gradle error is visible if this fails.
          set +e
          yes | buildozer -v android debug 2>&1 | tee android-build.log
          status=${PIPESTATUS[1]}
          set -e
          if [ "$status" -ne 0 ]; then
            echo "Buildozer failed. Last Gradle/build errors:" >&2
            grep -n -E -i 'FAILURE:|What went wrong|Execution failed|Could not|requires Java|error:' android-build.log | tail -80 || true
            exit "$status"
          fi

      - name: Upload Android diagnostic log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chess-analyzer-android-build-log
          path: android-build.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: chess-analyzer-android-apk
          path: bin/*.apk
          retention-days: 14

  build-ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install iOS Build Toolchain
        run: |
          brew install autoconf automake || true
          pip install --upgrade pip "cython<3.0" kivy-ios chess requests
          bash platform/ios/stockfish_ios_recipe.sh

      - name: Build Python & Kivy for iOS
        run: |
          toolchain build python3 kivy

      - name: Create & Package Xcode Project
        run: |
          # kivy-ios copies its source tree into the app bundle with rsync.
          # Never use the repository root directly: the generated Xcode project
          # and build outputs live inside it and can change during that copy,
          # causing rsync exit code 24 (files vanished during transfer).
          SOURCE_DIR="$RUNNER_TEMP/chess-analyzer-ios-source"
          mkdir -p "$SOURCE_DIR"
          rsync -a "$GITHUB_WORKSPACE/" "$SOURCE_DIR/" \
            --exclude '.git/' \
            --exclude '.buildozer/' \
            --exclude 'bin/' \
            --exclude 'chessanalyzer-ios/' \
            --exclude 'build/' \
            --exclude 'dist/' \
            --exclude '__pycache__/' \
            --exclude '*.pyc'
          toolchain create chessanalyzer "$SOURCE_DIR"
          cd chessanalyzer-ios
          # Retry once: kivy-ios' generated rsync phase can intermittently return
          # code 24 when generated files disappear during the first copy.
          xcodebuild -project chessanalyzer.xcodeproj -scheme chessanalyzer -configuration Release -sdk iphoneos IPHONEOS_DEPLOYMENT_TARGET=13.0 CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" PROVISIONING_PROFILE="" -derivedDataPath build clean build || \
            xcodebuild -project chessanalyzer.xcodeproj -scheme chessanalyzer -configuration Release -sdk iphoneos IPHONEOS_DEPLOYMENT_TARGET=13.0 CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" PROVISIONING_PROFILE="" -derivedDataPath build build
          mkdir -p Payload
          APP_PATH=$(find build -name "*.app" -type d | head -n 1)
          echo "Found compiled app at: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -rq ChessAnalyzer-unsigned.ipa Payload/
          mv ChessAnalyzer-unsigned.ipa "$GITHUB_WORKSPACE/"

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: chess-analyzer-ios-ipa
          path: ChessAnalyzer-unsigned.ipa
          retention-days: 14
